<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caronas 2026</title>
    <meta property="og:title" content="Controle de Carona - 2026">
    <meta property="og:description" content="Terra Boa - Cianorte.">
    <meta property="og:image" content="https://img.freepik.com/vetores-premium/ilustracao-de-design-de-icones-3d-de-calendario_9041-1431.jpg">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #22263a;
            --border: rgba(255,255,255,0.07);
            --border-bright: rgba(255,255,255,0.13);
            --text: #eef0f6;
            --muted: #6b7094;
            --accent: #6c63ff;
            --accent-glow: rgba(108,99,255,0.3);
            --kelen: #22d3ee;
            --kelen-bg: rgba(34,211,238,0.08);
            --thalita: #a78bfa;
            --thalita-bg: rgba(167,139,250,0.08);
            --success: #34d399;
            --success-bg: rgba(52,211,153,0.12);
            --danger: #f87171;
            --danger-bg: rgba(248,113,113,0.12);
            --amber: #fbbf24;
            --amber-bg: rgba(251,191,36,0.1);
            --radius: 14px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }

        /* ── Loading ── */
        #loading-overlay {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
            gap: 16px;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-bright);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loading-overlay span { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.05em; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Header ── */
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .app-title {
            font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .app-subtitle { font-size: 0.7rem; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }

        /* ── Tabs ── */
        .tabs-container {
            display: flex; gap: 4px; margin-bottom: 20px;
            padding: 5px; background: var(--surface); border-radius: var(--radius);
            overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
            border: 1px solid var(--border);
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 6px 14px; border: none; border-radius: 9px; cursor: pointer;
            font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.75rem;
            color: var(--muted); background: transparent; white-space: nowrap; flex-shrink: 0;
            transition: all 0.18s ease;
        }
        .tab-btn.active {
            background: var(--accent); color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* ── Desktop controls ── */
        .controls {
            display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: center; margin-bottom: 20px;
        }
        .btn {
            padding: 8px 16px; border: none; border-radius: var(--radius-sm); cursor: pointer;
            font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.78rem;
            display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
        }
        .btn-sync  { background: var(--surface2); color: var(--text); border: 1px solid var(--border-bright); }
        .btn-save  { background: var(--success); color: #052e16; }
        .btn-export{ background: var(--accent); color: #fff; }
        .btn-import{ background: var(--surface2); color: var(--muted); border: 1px solid var(--border-bright); }
        .btn-pdf   { background: var(--surface2); color: var(--text); border: 1px solid var(--border-bright); }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        /* ── Layout ── */
        .content-wrapper { display: flex; gap: 16px; align-items: flex-start; }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 6px; flex-grow: 1; min-width: 820px;
        }
        .weekday-header {
            text-align: center; font-size: 0.62rem; font-weight: 700;
            color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
            padding: 6px 0;
        }

        /* ── Day Card ── */
        .day-card {
            background: var(--surface); border-radius: var(--radius); padding: 8px;
            min-height: 170px; border: 1px solid var(--border); position: relative;
            transition: border-color 0.2s;
        }
        .day-card:hover { border-color: var(--border-bright); }
        .completed {
            background: linear-gradient(145deg, var(--surface), rgba(52,211,153,0.06)) !important;
            border-color: rgba(52,211,153,0.25) !important;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .completed::after {
            content: "✓"; position: absolute; top: 6px; right: 8px;
            color: var(--success); font-weight: 700; font-size: 1rem;
        }
        .weekend-card {
            background: var(--bg) !important; border-color: var(--border) !important;
            opacity: 0.4;
        }
        .weekend-label { text-align: center; color: var(--muted); font-size: 0.6rem; font-weight: 600; margin-top: 6px; }

        .feriado-card { opacity: 0.35; filter: grayscale(0.5); }

        .day-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px;
        }
        .day-header b { font-size: 0.9rem; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--text); }

        .car-input {
            width: 58%; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 6px; padding: 3px 6px; font-size: 0.62rem; font-weight: 600;
            color: var(--text); text-transform: uppercase; font-family: 'DM Mono', monospace;
            transition: border-color 0.15s;
        }
        .car-input:focus { outline: none; border-color: var(--accent); }
        .car-input::placeholder { color: var(--muted); font-weight: 400; }

        /* ── Btn absent (X) ── */
        .btn-absent {
            cursor: pointer; border-radius: 5px; width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700;
            border: 1px solid var(--border-bright); background: var(--surface2); color: var(--muted);
            flex-shrink: 0; transition: all 0.15s;
        }
        .btn-absent.active { background: var(--danger-bg) !important; color: var(--danger) !important; border-color: var(--danger) !important; -webkit-print-color-adjust: exact; }

        /* ── Print check pill ── */
        .print-check {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 38px; height: 15px; border: 1px solid var(--amber);
            border-radius: 20px; font-size: 0.46rem; font-weight: 700;
            background: var(--amber-bg); cursor: pointer; flex-shrink: 0;
            color: var(--amber); padding: 0 5px; white-space: nowrap;
            transition: all 0.15s; font-family: 'DM Sans', sans-serif;
        }
        .print-check::before { content: "A pagar"; }
        .print-check.checked {
            background: var(--success-bg) !important; color: var(--success) !important;
            border-color: var(--success) !important; -webkit-print-color-adjust: exact;
        }
        .print-check.checked::before { content: "✓ Pago"; }

        /* ── Person rows ── */
        .kelen-box { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
        .kelen-title {
            font-size: 0.58rem; font-weight: 700; color: var(--kelen);
            display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em;
        }
        .thalita-box { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
        .thalita-title {
            font-size: 0.58rem; font-weight: 700; color: var(--thalita);
            display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em;
        }

        .k-row, .t-row {
            display: flex; align-items: center; gap: 4px;
            margin-bottom: 3px; padding: 3px 4px; border-radius: 6px;
            transition: background 0.15s;
        }
        .k-row.is-absent, .t-row.is-absent {
            background: var(--danger-bg) !important; -webkit-print-color-adjust: exact;
        }
        .k-row.is-absent .print-check, .t-row.is-absent .print-check { display: none !important; }

        .k-label, .t-label {
            font-size: 0.58rem; font-weight: 700; width: 33px;
            color: var(--muted); font-family: 'DM Mono', monospace;
        }
        .k-ok, .t-ok { margin-left: auto; }

        /* ── Extras ── */
        .extra-name-input {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 5px; padding: 2px 5px; font-size: 0.62rem; font-weight: 600;
            color: var(--text); text-transform: uppercase; width: 68px; font-family: 'DM Mono', monospace;
        }
        .extra-name-input:focus { outline: none; border-color: var(--kelen); }
        .btn-remove-person {
            cursor: pointer; border-radius: 4px; width: 15px; height: 15px;
            display: flex; align-items: center; justify-content: center; font-size: 8px;
            border: 1px solid rgba(248,113,113,0.3); background: var(--danger-bg); color: var(--danger); flex-shrink: 0;
        }
        .btn-add-person {
            margin-top: 5px; width: 100%; font-size: 0.58rem; padding: 4px;
            background: transparent; border: 1px dashed var(--border-bright);
            border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600;
            font-family: 'DM Sans', sans-serif; transition: all 0.15s;
        }
        .btn-add-person:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Mobile lock overlay ── */
        .mobile-lock-overlay { display: none; position: absolute; inset: 0; z-index: 50; }

        /* ── FAB buttons ── */
        .fab-group { display: none; position: fixed; bottom: 20px; right: 18px; flex-direction: column; gap: 10px; z-index: 1000; }
        .fab {
            width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.55rem; font-weight: 700; font-family: 'DM Sans', sans-serif;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: all 0.18s; gap: 2px;
            line-height: 1;
        }
        .fab:hover { transform: scale(1.07); }
        .fab-edit   { background: var(--accent); color: #fff; }
        .fab-save   { background: var(--success); color: #052e16; display: none; }
        .fab-pdf    { background: var(--surface2); color: var(--text); border: 1px solid var(--border-bright); }
        .fab span.fab-icon { font-size: 1.1rem; }

        /* ── Sidebar ── */
        .sidebar {
            width: 270px; flex-shrink: 0;
            background: var(--surface); border-radius: var(--radius);
            padding: 16px; border: 1px solid var(--border);
        }
        .sidebar-section-title {
            font-size: 0.7rem; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .sidebar-section-title::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        /* Pendências por pessoa */
        .pend-pessoa { margin-bottom: 14px; }
        .pend-pessoa-nome {
            font-size: 0.72rem; font-weight: 700; color: var(--text);
            margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
        }
        .pend-pessoa-nome::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
        .pend-dia-row {
            display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
            margin-bottom: 4px; font-size: 0.68rem; padding-left: 11px;
        }
        .pend-dia-num { font-weight: 700; color: var(--muted); min-width: 36px; font-family: 'DM Mono', monospace; font-size: 0.65rem; }
        .pend-tag {
            display: inline-block; padding: 2px 7px; border-radius: 20px;
            font-size: 0.58rem; font-weight: 700; letter-spacing: 0.03em;
        }
        .pend-tag.ida   { background: rgba(108,99,255,0.15); color: #a5b4fc; }
        .pend-tag.volta { background: rgba(34,211,238,0.12); color: var(--kelen); }

        /* Financeiro */
        .finance-card { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .finance-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; background: var(--surface2); border-radius: var(--radius-sm);
            margin-bottom: 6px; border: 1px solid var(--border);
        }
        .finance-name { font-weight: 700; font-size: 0.82rem; color: var(--text); margin-bottom: 3px; display: block; }
        .finance-tag {
            display: inline-block; padding: 1px 7px; background: rgba(108,99,255,0.15);
            color: #a5b4fc; font-size: 0.6rem; font-weight: 700; border-radius: 20px;
        }
        .finance-value {
            font-weight: 800; color: var(--success); font-size: 0.95rem;
            font-family: 'DM Mono', monospace;
        }

        /* ── Mobile ── */
        @media screen and (max-width: 768px) {
            body { padding: 10px 10px 90px; }
            .controls { display: none; }
            .fab-group { display: flex; }
            .content-wrapper { flex-direction: column; gap: 12px; }
            .sidebar { order: -1; width: 100%; }
            .calendar-grid { grid-template-columns: repeat(2, 1fr); min-width: 100%; gap: 8px; }
            .weekday-header { display: none; }
            .day-card { min-height: auto; }
            .calendar-locked .mobile-lock-overlay { display: block; }
            .calendar-locked .car-input { pointer-events: none; }
        }

        /* ── Print ── */
        @media print {
            body { background: white; color: #1e293b; padding: 0; font-family: sans-serif; }
            #loading-overlay, .no-print, .tabs-container, .controls, .btn-absent,
            .fab-group, .mobile-lock-overlay { display: none !important; }

            :root {
                --bg: white; --surface: white; --surface2: #f8fafc;
                --border: #e2e8f0; --border-bright: #cbd5e1;
                --text: #1e293b; --muted: #64748b;
            }

            .content-wrapper { display: flex; flex-direction: column-reverse; }
            .sidebar { width: 100%; border: none; margin-bottom: 20px; border-radius: 0; background: white; }
            .calendar-grid { min-width: 100%; display: grid !important; grid-template-columns: repeat(7, 1fr) !important; gap: 4px; page-break-before: always; }
            .day-card { border: 1px solid #e2e8f0 !important; min-height: 120px; background: white !important; border-radius: 6px; }
            .weekend-card { opacity: 0.5; }
            .app-title { -webkit-text-fill-color: #1e293b; }

            .k-row.is-absent, .t-row.is-absent { display: none !important; }
            .kelen-box:not(:has(.k-row:not(.is-absent))) { display: none !important; }
            .thalita-box:not(:has(.t-row:not(.is-absent))) { display: none !important; }

            .kelen-title { color: #0284c7 !important; }
            .thalita-title { color: #7c3aed !important; }
            .k-label, .t-label { color: #64748b !important; }
            .day-header b { color: #1e293b; }
            .car-input { background: transparent; border-color: #e2e8f0; color: #1e293b; }

            .print-check {
                display: inline-flex !important; border: 1px solid #f59e0b !important;
                background: #fffbeb !important; color: #b45309 !important;
                -webkit-print-color-adjust: exact; print-color-adjust: exact;
            }
            .print-check::before { content: "A pagar"; }
            .print-check.checked { background: #dcfce7 !important; color: #166534 !important; border-color: #22c55e !important; }
            .print-check.checked::before { content: "✓ Pago"; }

            .pend-tag.ida   { background: #ede9fe !important; color: #6d28d9 !important; -webkit-print-color-adjust: exact; }
            .pend-tag.volta { background: #cffafe !important; color: #0e7490 !important; -webkit-print-color-adjust: exact; }
            .pend-pessoa-nome::before { background: #6c63ff !important; }
            .finance-item { background: #f8fafc !important; border-color: #e2e8f0 !important; }
            .finance-value { color: #166534 !important; }
            .finance-tag { background: #ede9fe !important; color: #6d28d9 !important; }
            .btn-absent.active { background: #fee2e2 !important; color: #dc2626 !important; border-color: #dc2626 !important; }
            .completed { background: #f0fdf4 !important; border-color: #bbf7d0 !important; }
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <span>CARREGANDO DADOS...</span>
</div>

<!-- FABs mobile -->
<div class="fab-group no-print">
    <button class="fab fab-pdf" onclick="window.print()">
        <span class="fab-icon">📄</span>PDF
    </button>
    <button class="fab fab-save" id="fabSalvar" onclick="salvarNaPlanilha()">
        <span class="fab-icon">💾</span>SALVAR
    </button>
    <button class="fab fab-edit" id="btnLock" onclick="toggleMobileLock()">
        <span class="fab-icon">🔓</span>EDITAR
    </button>
</div>

<header class="app-header no-print">
    <div>
        <div class="app-title" id="monthTitle">Caronas 2026</div>
        <div class="app-subtitle">TERRA BOA → CIANORTE</div>
    </div>
</header>

<div class="tabs-container no-print" id="tabs"></div>

<div class="controls no-print">
    <button class="btn btn-sync"   onclick="sincronizarGoogleSheets()">🔄 Puxar Planilha</button>
    <button class="btn btn-save"   id="btnSalvar" onclick="salvarNaPlanilha()">💾 Salvar Planilha</button>
    <button class="btn btn-export" onclick="exportarCSV()">📥 Exportar Backup</button>
    <button class="btn btn-import" onclick="document.getElementById('fileInput').click()">📤 Importar Backup</button>
    <button class="btn btn-pdf"    onclick="window.print()">📄 Imprimir PDF</button>
    <input type="file" id="fileInput" style="display:none" accept=".csv" onchange="importarCSV(this)">
</div>

<div class="main-container">
    <div class="content-wrapper">
        <div class="calendar-grid" id="calendar"></div>
        <div class="sidebar" id="sidebarPendencias">
            <div class="sidebar-section-title">Pendências <span id="selectedMonthName"></span></div>
            <div id="pendingList"></div>
            <div class="finance-card">
                <div class="sidebar-section-title">Valores em aberto</div>
                <div id="financeList"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const ANO = 2026;
    const SENHA_ACESSO = "Marcos@";
    const HOJE = new Date();
    const MES_ATUAL = HOJE.getMonth();
    const DIA_ATUAL = HOJE.getDate();
    let mesSel = MES_ATUAL;
    let mobileEditMode = false;
    const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const SHEET_URL = "https://script.google.com/macros/s/AKfycby6mh-uw85IelgDJYDhavAgqAriQSCVaLIXLYZTX_BMYTidCei2j5T9VTS5Le6by2EhUQ/exec";

    async function sincronizarGoogleSheets() {
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();
            if (!text || text.includes("<!DOCTYPE")) { document.getElementById('loading-overlay').style.display = 'none'; return; }
            localStorage.clear();
            text.split("\n").forEach(l => { const p = l.split(","); if (p.length >= 2) localStorage.setItem(p[0].trim(), p[1].trim()); });
            renderizar();
        } catch(e) { console.error(e); }
        finally { document.getElementById('loading-overlay').style.display = 'none'; }
    }

    async function salvarNaPlanilha() {
        const senha = prompt("Senha para salvar:");
        if (senha !== SENHA_ACESSO) { alert("Senha incorreta!"); return; }
        const btn = document.getElementById('btnSalvar');
        const fab = document.getElementById('fabSalvar');
        if (btn) { btn.innerText = "⏳..."; btn.disabled = true; }
        if (fab) { fab.querySelector('.fab-icon').textContent = '⏳'; fab.disabled = true; }
        const dados = {};
        for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); dados[k] = localStorage.getItem(k); }
        try {
            await fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(dados) });
            alert("Salvo com sucesso!");
        } catch(e) { alert("Erro ao salvar."); }
        finally {
            if (btn) { btn.innerText = "💾 Salvar Planilha"; btn.disabled = false; }
            if (fab) { fab.querySelector('.fab-icon').textContent = '💾'; fab.disabled = false; }
        }
    }

    function toggleMobileLock() {
        if (!mobileEditMode) {
            const senha = prompt("Senha para editar:");
            if (senha !== SENHA_ACESSO) { alert("Senha incorreta!"); return; }
            mobileEditMode = true;
            const btn = document.getElementById('btnLock');
            btn.querySelector('.fab-icon').textContent = '🔒';
            btn.querySelector(':last-child') && (btn.lastChild.textContent = 'TRAVAR');
            btn.innerHTML = '<span class="fab-icon">🔒</span>TRAVAR';
            btn.style.background = 'var(--success)';
            btn.style.color = '#052e16';
            document.getElementById('fabSalvar').style.display = 'flex';
            renderizar();
        } else {
            mobileEditMode = false;
            const btn = document.getElementById('btnLock');
            btn.innerHTML = '<span class="fab-icon">🔓</span>EDITAR';
            btn.style.background = 'var(--accent)';
            btn.style.color = '#fff';
            document.getElementById('fabSalvar').style.display = 'none';
            renderizar();
        }
    }

    function exportarCSV() {
        let csv = "Chave,Valor\n";
        for (let i = 0; i < localStorage.length; i++) csv += `${localStorage.key(i)},${localStorage.getItem(localStorage.key(i))}\n`;
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob); link.download = `backup_caronas_2026.csv`; link.click();
    }

    function importarCSV(input) {
        const senha = prompt("Senha para importar:");
        if (senha !== SENHA_ACESSO) { alert("Senha incorreta!"); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
            e.target.result.split("\n").forEach(l => { const p = l.split(","); if (p.length >= 2) localStorage.setItem(p[0].trim(), p[1].trim()); });
            renderizar(); alert("Importado!");
        };
        reader.readAsText(input.files[0]);
    }

    function toggle(key) {
        const scrollY = window.scrollY;
        localStorage.setItem(key, localStorage.getItem(key) === 'true' ? 'false' : 'true');
        renderizar();
        window.scrollTo(0, scrollY);
    }

    function renderizar() {
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === mesSel));
        document.getElementById('monthTitle').innerText = `Caronas — ${meses[mesSel]} / ${ANO}`;
        document.getElementById('selectedMonthName').innerText = meses[mesSel];

        const grid = document.getElementById('calendar');
        mobileEditMode ? grid.classList.remove('calendar-locked') : grid.classList.add('calendar-locked');
        grid.innerHTML = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d => `<div class="weekday-header">${d}</div>`).join('');

        const inicio = new Date(ANO, mesSel, 1).getDay();
        const desloc = inicio === 0 ? 6 : inicio - 1;
        for (let i = 0; i < desloc; i++) grid.appendChild(Object.assign(document.createElement('div'), {className:'day-card', style:'visibility:hidden;border:none;background:transparent'}));

        for (let d = 1; d <= new Date(ANO, mesSel + 1, 0).getDate(); d++) {
            const sem = new Date(ANO, mesSel, d).getDay();
            const card = document.createElement('div'); card.className = 'day-card'; card.id = `card-${d}`;

            if (sem === 0 || sem === 6) {
                card.classList.add('weekend-card');
                card.innerHTML = `<div class="day-header"><b>${d}</b></div><div class="weekend-label">SAB/DOM</div>`;
            } else {
                const carK = `car-${mesSel}-${d}`;
                const carVal = localStorage.getItem(carK) || '';
                const isFeriado = /FERIADO|RECESSO/.test(carVal.toUpperCase());
                if (isFeriado) card.classList.add('feriado-card');

                let html = `<div class="mobile-lock-overlay"></div>`;
                html += `<div class="day-header"><b>${d}</b><input type="text" class="car-input" placeholder="CARRO" value="${carVal}" oninput="localStorage.setItem('${carK}', this.value.toUpperCase()); const f=/FERIADO|RECESSO/.test(this.value.toUpperCase()); document.getElementById('card-${d}').classList.toggle('feriado-card', f);"></div>`;

                // KELEN
                html += `<div class="kelen-box"><span class="kelen-title">Kelen</span>
                    <div class="k-row ${localStorage.getItem(`k26-${mesSel}-${d}-ida-falta`)==='true'?'is-absent':''}">
                        <div class="btn-absent no-print ${localStorage.getItem(`k26-${mesSel}-${d}-ida-falta`)==='true'?'active':''}" onclick="toggle('k26-${mesSel}-${d}-ida-falta')">X</div>
                        <span class="k-label">IDA</span>
                        <div class="print-check k-ok ${localStorage.getItem(`k26-${mesSel}-${d}-ida-ok`)==='true'?'checked':''}" onclick="toggle('k26-${mesSel}-${d}-ida-ok')"></div>
                    </div>
                    <div class="k-row ${localStorage.getItem(`k26-${mesSel}-${d}-vol-falta`)==='true'?'is-absent':''}">
                        <div class="btn-absent no-print ${localStorage.getItem(`k26-${mesSel}-${d}-vol-falta`)==='true'?'active':''}" onclick="toggle('k26-${mesSel}-${d}-vol-falta')">X</div>
                        <span class="k-label">VOLTA</span>
                        <div class="print-check k-ok ${localStorage.getItem(`k26-${mesSel}-${d}-vol-ok`)==='true'?'checked':''}" onclick="toggle('k26-${mesSel}-${d}-vol-ok')"></div>
                    </div></div>`;

                // EXTRAS
                const extrasCount = parseInt(localStorage.getItem(`extras-count-${mesSel}-${d}`) || '0');
                for (let ei = 0; ei < extrasCount; ei++) {
                    const enk = `extra-name-${mesSel}-${d}-${ei}`;
                    const eName = localStorage.getItem(enk) || '';
                    const eIdaOk = localStorage.getItem(`extra-ida-ok-${mesSel}-${d}-${ei}`) === 'true';
                    const eIdaF  = localStorage.getItem(`extra-ida-f-${mesSel}-${d}-${ei}`)  === 'true';
                    const eVolOk = localStorage.getItem(`extra-vol-ok-${mesSel}-${d}-${ei}`) === 'true';
                    const eVolF  = localStorage.getItem(`extra-vol-f-${mesSel}-${d}-${ei}`)  === 'true';
                    html += `<div class="kelen-box">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                            <input class="extra-name-input" placeholder="NOME" value="${eName}" oninput="localStorage.setItem('${enk}', this.value.toUpperCase()); atualizarPendencias(); atualizarFinanceiro();">
                            <div class="btn-remove-person no-print" onclick="removerPessoa(${mesSel},${d},${ei})">✕</div>
                        </div>
                        <div class="k-row ${eIdaF?'is-absent':''}">
                            <div class="btn-absent no-print ${eIdaF?'active':''}" onclick="toggle('extra-ida-f-${mesSel}-${d}-${ei}')">X</div>
                            <span class="k-label">IDA</span>
                            <div class="print-check k-ok ${eIdaOk?'checked':''}" onclick="toggle('extra-ida-ok-${mesSel}-${d}-${ei}')"></div>
                        </div>
                        <div class="k-row ${eVolF?'is-absent':''}">
                            <div class="btn-absent no-print ${eVolF?'active':''}" onclick="toggle('extra-vol-f-${mesSel}-${d}-${ei}')">X</div>
                            <span class="k-label">VOLTA</span>
                            <div class="print-check k-ok ${eVolOk?'checked':''}" onclick="toggle('extra-vol-ok-${mesSel}-${d}-${ei}')"></div>
                        </div>
                    </div>`;
                }
                html += `<button class="btn-add-person no-print" onclick="adicionarPessoa(${mesSel},${d})">+ Adicionar pessoa</button>`;

                // THALITA (qua/sex)
                if (sem === 3 || sem === 5) {
                    html += `<div class="thalita-box"><span class="thalita-title">Thalita</span>
                        <div class="t-row ${localStorage.getItem(`t26-${mesSel}-${d}-ida-falta`)==='true'?'is-absent':''}">
                            <div class="btn-absent no-print ${localStorage.getItem(`t26-${mesSel}-${d}-ida-falta`)==='true'?'active':''}" onclick="toggle('t26-${mesSel}-${d}-ida-falta')">X</div>
                            <span class="t-label">IDA</span>
                            <div class="print-check t-ok ${localStorage.getItem(`t26-${mesSel}-${d}-ida-ok`)==='true'?'checked':''}" onclick="toggle('t26-${mesSel}-${d}-ida-ok')"></div>
                        </div>
                        <div class="t-row ${localStorage.getItem(`t26-${mesSel}-${d}-vol-falta`)==='true'?'is-absent':''}">
                            <div class="btn-absent no-print ${localStorage.getItem(`t26-${mesSel}-${d}-vol-falta`)==='true'?'active':''}" onclick="toggle('t26-${mesSel}-${d}-vol-falta')">X</div>
                            <span class="t-label">VOLTA</span>
                            <div class="print-check t-ok ${localStorage.getItem(`t26-${mesSel}-${d}-vol-ok`)==='true'?'checked':''}" onclick="toggle('t26-${mesSel}-${d}-vol-ok')"></div>
                        </div></div>`;
                }

                card.innerHTML = html;
            }
            grid.appendChild(card);
            verificarStatus(d);
        }
        atualizarPendencias();
        atualizarFinanceiro();

        const activeTab = document.querySelector('.tab-btn.active');
        if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function verificarStatus(d) {
        const card = document.getElementById(`card-${d}`);
        const sem = new Date(ANO, mesSel, d).getDay();
        if (!card || sem === 0 || sem === 6) return;
        let ok = true;
        if (localStorage.getItem(`k26-${mesSel}-${d}-ida-ok`) !== 'true' && localStorage.getItem(`k26-${mesSel}-${d}-ida-falta`) !== 'true') ok = false;
        if (localStorage.getItem(`k26-${mesSel}-${d}-vol-ok`) !== 'true' && localStorage.getItem(`k26-${mesSel}-${d}-vol-falta`) !== 'true') ok = false;
        if (sem === 3 || sem === 5) {
            if (localStorage.getItem(`t26-${mesSel}-${d}-ida-ok`) !== 'true' && localStorage.getItem(`t26-${mesSel}-${d}-ida-falta`) !== 'true') ok = false;
            if (localStorage.getItem(`t26-${mesSel}-${d}-vol-ok`) !== 'true' && localStorage.getItem(`t26-${mesSel}-${d}-vol-falta`) !== 'true') ok = false;
        }
        card.classList.toggle('completed', ok);
    }

    function atualizarPendencias() {
        const list = document.getElementById('pendingList'); list.innerHTML = '';
        let limiteDia;
        if (mesSel < MES_ATUAL) limiteDia = 31;
        else if (mesSel === MES_ATUAL) limiteDia = DIA_ATUAL;
        else return;

        const porPessoa = {};
        const addPend = (pessoa, dia, trecho) => {
            if (!porPessoa[pessoa]) porPessoa[pessoa] = {};
            if (!porPessoa[pessoa][dia]) porPessoa[pessoa][dia] = [];
            porPessoa[pessoa][dia].push(trecho);
        };

        for (let d = 1; d <= limiteDia; d++) {
            const dt = new Date(ANO, mesSel, d);
            if (dt.getDay() === 0 || dt.getDay() === 6 || dt.getMonth() !== mesSel) continue;

            const kelenPago = mesSel <= 3 && localStorage.getItem(`p-${mesSel}-${d}-KELEN`) === 'true';
            if (!kelenPago) {
                if (localStorage.getItem(`k26-${mesSel}-${d}-ida-ok`) !== 'true' && localStorage.getItem(`k26-${mesSel}-${d}-ida-falta`) !== 'true') addPend('Kelen', d, 'ida');
                if (localStorage.getItem(`k26-${mesSel}-${d}-vol-ok`) !== 'true' && localStorage.getItem(`k26-${mesSel}-${d}-vol-falta`) !== 'true') addPend('Kelen', d, 'volta');
            }

            const extrasCount = parseInt(localStorage.getItem(`extras-count-${mesSel}-${d}`) || '0');
            for (let ei = 0; ei < extrasCount; ei++) {
                const rn = localStorage.getItem(`extra-name-${mesSel}-${d}-${ei}`) || `Extra ${ei+1}`;
                const nome = rn.charAt(0).toUpperCase() + rn.slice(1).toLowerCase();
                if (localStorage.getItem(`extra-ida-ok-${mesSel}-${d}-${ei}`) !== 'true' && localStorage.getItem(`extra-ida-f-${mesSel}-${d}-${ei}`) !== 'true') addPend(nome, d, 'ida');
                if (localStorage.getItem(`extra-vol-ok-${mesSel}-${d}-${ei}`) !== 'true' && localStorage.getItem(`extra-vol-f-${mesSel}-${d}-${ei}`) !== 'true') addPend(nome, d, 'volta');
            }

            if (dt.getDay() === 3 || dt.getDay() === 5) {
                if (localStorage.getItem(`t26-${mesSel}-${d}-ida-falta`) !== 'true' && localStorage.getItem(`t26-${mesSel}-${d}-ida-ok`) !== 'true') addPend('Thalita', d, 'ida');
                if (localStorage.getItem(`t26-${mesSel}-${d}-vol-falta`) !== 'true' && localStorage.getItem(`t26-${mesSel}-${d}-vol-ok`) !== 'true') addPend('Thalita', d, 'volta');
            }
        }

        if (Object.keys(porPessoa).length === 0) {
            list.innerHTML = '<div style="font-size:0.72rem;color:var(--success);font-weight:600;text-align:center;padding:10px;">Tudo em dia ✓</div>';
            return;
        }
        for (const pessoa in porPessoa) {
            let html = `<div class="pend-pessoa"><div class="pend-pessoa-nome">${pessoa}</div>`;
            for (const dia in porPessoa[pessoa]) {
                const tags = porPessoa[pessoa][dia].map(t => `<span class="pend-tag ${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</span>`).join(' ');
                html += `<div class="pend-dia-row"><span class="pend-dia-num">Dia ${dia}</span>${tags}</div>`;
            }
            html += `</div>`;
            list.innerHTML += html;
        }
    }

    function atualizarFinanceiro() {
        const list = document.getElementById('financeList'); list.innerHTML = '';
        const dividas = {};
        const DATA_REAJUSTE = new Date(2026, 6, 1); // 1º de julho de 2026
        const diasNoMes = new Date(ANO, mesSel + 1, 0).getDate();

        for (let d = 1; d <= diasNoMes; d++) {
            if (mesSel === MES_ATUAL && d > DIA_ATUAL) continue;
            if (mesSel > MES_ATUAL) continue;
            const dt = new Date(ANO, mesSel, d);
            const sem = dt.getDay();
            if (sem === 0 || sem === 6) continue;
            const VAL_TRECHO = dt >= DATA_REAJUSTE ? 7.0 : 6.0;
            const VAL_TRECHO_KELEN = 6.0;

            const kelenPago = mesSel <= 3 && localStorage.getItem(`p-${mesSel}-${d}-KELEN`) === 'true';
            if (!kelenPago) {
                ['ida', 'vol'].forEach(t => {
                    if (localStorage.getItem(`k26-${mesSel}-${d}-${t}-ok`) !== 'true' && localStorage.getItem(`k26-${mesSel}-${d}-${t}-falta`) !== 'true') {
                        if (!dividas["KELEN"]) dividas["KELEN"] = {};
                        dividas["KELEN"]["Marcos"] = (dividas["KELEN"]["Marcos"] || 0) + VAL_TRECHO_KELEN;
                    }
                });
            }

            const extrasCountFin = parseInt(localStorage.getItem(`extras-count-${mesSel}-${d}`) || '0');
            for (let ei = 0; ei < extrasCountFin; ei++) {
                const eName = (localStorage.getItem(`extra-name-${mesSel}-${d}-${ei}`) || `EXTRA${ei+1}`).toUpperCase();
                ['ida', 'vol'].forEach(t => {
                    const eOk = localStorage.getItem(`extra-${t}-ok-${mesSel}-${d}-${ei}`) === 'true';
                    const eF  = localStorage.getItem(`extra-${t}-f-${mesSel}-${d}-${ei}`)  === 'true';
                    if (!eOk && !eF) {
                        if (!dividas[eName]) dividas[eName] = {};
                        dividas[eName]["Marcos"] = (dividas[eName]["Marcos"] || 0) + VAL_TRECHO;
                    }
                });
            }

            if (sem === 3 || sem === 5) {
                ['ida', 'vol'].forEach(t => {
                    if (localStorage.getItem(`t26-${mesSel}-${d}-${t}-ok`) !== 'true' && localStorage.getItem(`t26-${mesSel}-${d}-${t}-falta`) !== 'true') {
                        if (!dividas["THALITA"]) dividas["THALITA"] = {};
                        dividas["THALITA"]["Marcos"] = (dividas["THALITA"]["Marcos"] || 0) + VAL_TRECHO;
                    }
                });
            }
        }

        for (const devedor in dividas) {
            const nome = devedor.charAt(0).toUpperCase() + devedor.slice(1).toLowerCase();
            for (const credor in dividas[devedor]) {
                const val = dividas[devedor][credor];
                list.innerHTML += `<div class="finance-item">
                    <div><span class="finance-name">${nome}</span><span class="finance-tag">${credor}</span></div>
                    <span class="finance-value">R$&nbsp;${val.toFixed(2).replace('.', ',')}</span>
                </div>`;
            }
        }
        if (list.innerHTML === '') list.innerHTML = '<div style="font-size:0.72rem;color:var(--success);font-weight:600;text-align:center;padding:10px;">Sem pendências ✓</div>';
    }

    function adicionarPessoa(mes, dia) {
        const ck = `extras-count-${mes}-${dia}`;
        localStorage.setItem(ck, parseInt(localStorage.getItem(ck) || '0') + 1);
        renderizar();
    }

    function removerPessoa(mes, dia, idx) {
        const ck = `extras-count-${mes}-${dia}`;
        const count = parseInt(localStorage.getItem(ck) || '0');
        for (let i = idx; i < count - 1; i++) {
            const n = i + 1;
            localStorage.setItem(`extra-name-${mes}-${dia}-${i}`,   localStorage.getItem(`extra-name-${mes}-${dia}-${n}`)   || '');
            localStorage.setItem(`extra-ida-ok-${mes}-${dia}-${i}`, localStorage.getItem(`extra-ida-ok-${mes}-${dia}-${n}`) || 'false');
            localStorage.setItem(`extra-ida-f-${mes}-${dia}-${i}`,  localStorage.getItem(`extra-ida-f-${mes}-${dia}-${n}`)  || 'false');
            localStorage.setItem(`extra-vol-ok-${mes}-${dia}-${i}`, localStorage.getItem(`extra-vol-ok-${mes}-${dia}-${n}`) || 'false');
            localStorage.setItem(`extra-vol-f-${mes}-${dia}-${i}`,  localStorage.getItem(`extra-vol-f-${mes}-${dia}-${n}`)  || 'false');
        }
        const last = count - 1;
        ['name','ida-ok','ida-f','vol-ok','vol-f'].forEach(k => localStorage.removeItem(`extra-${k}-${mes}-${dia}-${last}`));
        localStorage.setItem(ck, Math.max(0, count - 1));
        renderizar();
    }

    // Init tabs
    const tB = document.getElementById('tabs');
    meses.forEach((m, i) => {
        const b = document.createElement('button'); b.className = 'tab-btn'; b.innerText = m;
        b.onclick = () => { mesSel = i; renderizar(); }; tB.appendChild(b);
    });

    sincronizarGoogleSheets();
</script>
</body>
</html>
